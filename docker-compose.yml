services:
  postgres:
    image: postgres:16-alpine
    container_name: relay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    volumes:
      - relay_pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: relay-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI (view emails in browser)

  livekit:
    image: livekit/livekit-server:latest
    container_name: relay-livekit
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0", "--keys", "devkey: secret"]
    ports:
      - "7880:7880"     # WebSocket signaling
      - "7881:7881"     # TCP fallback
      - "7882:7882/udp" # WebRTC UDP media traffic

volumes:
  relay_pgdata:
